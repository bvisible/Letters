name: Upstream preview
# Weekly measurement for the frappe/erpnext upgrade (tracker #138): the same CI
# as tests.yml but the bench is initialised on UPSTREAM frappe/frappe and
# frappe/erpnext (version-15) instead of our forks. Reports to a separate
# [CI amont] issue (key ci-upstream::) — never pollutes the normal [CI] issue.
on:
  workflow_dispatch:
  schedule:
    - cron: "36 5 * * 1"
jobs:
  preview:
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: letters
      install_apps: ""
      # Same pytest pass as tests.yml: the mirror check fails the preview on any input
      # that differs, since a preview that differs measures its own gap, not upstream's.
      pytest_paths: letters/tests/api_mock_tests.py
      upstream_preview: true
    # inherit: CI_REPORT_SECRET + FLEET_READ_TOKEN (private bvisible deps such as neoffice_theme)
    secrets: inherit
